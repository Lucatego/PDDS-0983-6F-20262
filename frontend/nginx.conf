# nginx del cliente web de PaqRap: estáticos de Vite + proxy al backend (servicio «backend» del compose).
# El navegador solo habla con este origen: REST en /api y STOMP en /ws, sin CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST. Los archivos de ventas/bloqueos se suben como texto plano y su carga a la BD puede tardar.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # STOMP sobre WebSocket nativo (sin SockJS). El heartbeat de STOMP es de 10 s.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Recursos con hash en el nombre: se pueden guardar en caché sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (BrowserRouter): toda ruta que no sea un archivo vuelve a index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
