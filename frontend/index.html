<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="PaqRap — Centro de Operaciones: registro de pedidos, planificación de rutas y monitoreo de la flota en tiempo real." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PaqRap · Centro de Operaciones</title>
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar el parpadeo claro/oscuro.
      try {
        var t = JSON.parse(localStorage.getItem('paqrap-ui') || '{}');
        var theme = t && t.state && t.state.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
