# Solución completa de PaqRap en contenedores: BD (PostgreSQL 18) + backend (Spring Boot, Java 25) + frontend (nginx).
# Uso, desde la raíz del repositorio:
#   docker compose up -d --build     construye y levanta todo; la GUI queda en http://localhost (o la IP del equipo)
#   docker compose logs -f backend   registros del backend
#   docker compose down              detiene (conserva los datos) | docker compose down -v (borra los datos)
# Todo corre en el equipo, sin servicios externos (DAS). Nunca apunta al RDS: el backend usa la BD del contenedor.
name: paqrap

# La BD es la del compose de desarrollo del backend (servicio «postgres», puerto 5433 en el host).
include:
  - backend/compose.yaml

services:
  backend:
    build: ./backend
    image: paqrap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAQRAP_DB_URL: jdbc:postgresql://postgres:5432/paqrap
      PAQRAP_DB_USUARIO: paqrap
      PAQRAP_DB_CLAVE: paqrap_local
      # Flyway crea el esquema (V1..Vn) en la BD local del contenedor.
      PAQRAP_MIGRACIONES_HABILITADAS: "true"
    ports:
      - "${PAQRAP_PUERTO_BACKEND:-8080}:8080"   # acceso directo a /api y /ws (p. ej. npm run dev con el proxy de Vite)
    healthcheck:
      # La imagen JRE no trae curl ni wget: GET /api/salud con /dev/tcp de bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/salud HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_SOURCE: server
    image: paqrap-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PAQRAP_PUERTO_WEB:-80}:80"
